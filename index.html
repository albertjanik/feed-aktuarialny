<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed Aktuarialny</title>
<meta name="description" content="Nieskończony feed fiszek z egzaminów aktuarialnych KNF — zadania z rozwiązaniami, wzory i fakty.">
<meta name="theme-color" content="#eceef0">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#eceef0; --surface:#fff; --surface-2:#f5f7f8; --ink:#151d26; --ink-2:#47535f;
  --muted:#77848f; --line:#dce1e6; --line-soft:#e8ecef;
  --accent:#0d6e66; --accent-soft:#e0efed;
  --ochre:#8f5612; --ochre-soft:#f7eede;
  --indigo:#3a539b; --indigo-soft:#e5eaf6;
  --warn:#8d4b1e; --warn-soft:#f8ece2; --warn-line:#e4c9b4;
  --shadow:0 1px 2px rgba(20,30,40,.05), 0 6px 18px -10px rgba(20,30,40,.22);
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1317; --surface:#161d23; --surface-2:#1b232a; --ink:#e3e9ee; --ink-2:#aab7c2;
    --muted:#7d8b97; --line:#29333d; --line-soft:#212a32;
    --accent:#4fb3a7; --accent-soft:#0f2e2c;
    --ochre:#d29a56; --ochre-soft:#2b2317;
    --indigo:#8fa6e0; --indigo-soft:#1a2135;
    --warn:#d9985c; --warn-soft:#2a2118; --warn-line:#443320;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1317; --surface:#161d23; --surface-2:#1b232a; --ink:#e3e9ee; --ink-2:#aab7c2;
  --muted:#7d8b97; --line:#29333d; --line-soft:#212a32;
  --accent:#4fb3a7; --accent-soft:#0f2e2c;
  --ochre:#d29a56; --ochre-soft:#2b2317;
  --indigo:#8fa6e0; --indigo-soft:#1a2135;
  --warn:#d9985c; --warn-soft:#2a2118; --warn-line:#443320;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}

/* ---------- pasek górny ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.bar-in{max-width:680px;margin:0 auto;padding:10px 16px 11px;display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:-.01em;margin:0;white-space:nowrap}
.brand span{color:var(--accent)}
.count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:inherit;font-weight:500;font-size:13px;
  padding:5px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chip{appearance:none;font:inherit;font-size:12px;font-weight:500;padding:4px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.chip.s-nowy[aria-pressed="true"]{background:var(--line-soft);color:var(--ink-2)}
.chip.s-nieumiem[aria-pressed="true"]{background:var(--ochre-soft);color:var(--ochre)}
.chip.s-umiem[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
select{font:inherit;font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);max-width:200px}
.ghost{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font:inherit;font-size:12px;padding:4px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.progress{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;
  white-space:nowrap;display:flex;gap:9px;margin-left:auto}
.progress b{font-weight:500}
.progress .p-u{color:var(--accent)}
.progress .p-n{color:var(--ochre)}

/* panel postępu */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--ink-2)}
.panel textarea{width:100%;min-height:62px;font-family:var(--mono);font-size:11px;padding:7px;border-radius:7px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);resize:vertical}
.panel-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.panel-msg{font-size:11.5px;color:var(--accent)}

/* ---------- strumień ---------- */
main{max-width:680px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card[data-st="umiem"]{border-left:3px solid var(--accent)}
.card[data-st="nieumiem"]{border-left:3px solid var(--ochre)}
.card-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:12px 16px 0}
.kind{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;
  padding:2px 7px;border-radius:5px}
.k-zadanie{background:var(--accent-soft);color:var(--accent)}
.k-wzor{background:var(--ochre-soft);color:var(--ochre)}
.k-fakt{background:var(--indigo-soft);color:var(--indigo)}
.src{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.topic{margin-left:auto;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right}

.card-body{padding:9px 16px 14px;font-family:var(--serif);font-size:15.5px;line-height:1.62;color:var(--ink)}
.card-body>:first-child{margin-top:0}
.card-body>:last-child{margin-bottom:0}
.card-title{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.3;margin:0 0 6px;text-wrap:balance}

.reveal{width:100%;appearance:none;border:0;border-top:1px dashed var(--line);background:var(--surface-2);
  color:var(--accent);font:inherit;font-weight:500;font-size:12.5px;letter-spacing:.02em;
  padding:10px 16px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:7px}
.reveal:hover{background:var(--accent-soft)}
.reveal:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.reveal .arrow{transition:transform .18s ease}
.card.open .reveal .arrow{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.reveal .arrow{transition:none}}

.sol{padding:4px 16px 16px;border-top:1px solid var(--line-soft);background:var(--surface-2);
  font-family:var(--serif);font-size:15px;line-height:1.62}
.sol h3{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--accent);
  margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sol h3:first-child{margin-top:12px}
.sol h2{font-family:var(--sans);font-size:14px;font-weight:600;margin:18px 0 6px}
.sol p{margin:.55em 0}
.sol ul,.sol ol{margin:.5em 0;padding-left:1.25em}
.sol li{margin:.2em 0}
.sol strong{font-weight:600}
.sol code{font-family:var(--mono);font-size:.88em;background:var(--surface);padding:1px 4px;border-radius:4px;border:1px solid var(--line)}
.sol hr{border:0;border-top:1px solid var(--line);margin:16px 0}

/* znacznik umiem / nie umiem */
.mark{display:flex;align-items:center;gap:7px;padding:9px 16px;border-top:1px solid var(--line-soft);
  background:var(--surface);font-size:12px}
.mark-lbl{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:auto}
.mk{appearance:none;font:inherit;font-size:12px;font-weight:500;padding:5px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.mk:hover{border-color:var(--ink-2)}
.mk:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card[data-st="umiem"] .mk-yes{background:var(--accent);border-color:var(--accent);color:#fff}
.card[data-st="nieumiem"] .mk-no{background:var(--ochre);border-color:var(--ochre);color:#fff}
.card[data-st="umiem"] .mark-lbl{color:var(--accent)}
.card[data-st="nieumiem"] .mark-lbl{color:var(--ochre)}

.note{margin-top:14px;background:var(--warn-soft);border:1px solid var(--warn-line);border-left:3px solid var(--warn);
  border-radius:0 8px 8px 0;padding:10px 13px;font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--ink-2)}
.note b{color:var(--warn);font-weight:600;display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}

table{border-collapse:collapse;font-family:var(--sans);font-size:13px;margin:.7em 0;min-width:100%}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left;font-variant-numeric:tabular-nums}
th{background:var(--surface-2);font-weight:600}
.sol th{background:var(--surface)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.katex{font-size:1.02em}
.katex-display{margin:.7em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}

.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty h2{font-family:var(--serif);font-size:20px;color:var(--ink);margin:0 0 8px}
.empty p{margin:0 auto;max-width:36ch;font-size:14px}
#sentinel{height:1px}
.loading{text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;padding:8px 0 16px}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="bar-top">
      <h1 class="brand">Feed <span>Aktuarialny</span></h1>
      <div class="seg" role="group" aria-label="Moduł">
        <button id="m-ryzyko" aria-pressed="true">Ryzyko</button>
        <button id="m-majatek" aria-pressed="false">Majątek</button>
        <button id="m-zycie" aria-pressed="false">Życie</button>
      </div>
      <span class="count" id="count">wczytuję…</span>
    </div>
    <div class="filters">
      <button class="chip" id="t-zadanie" aria-pressed="true">Zadania</button>
      <button class="chip" id="t-wzor" aria-pressed="true">Wzory</button>
      <button class="chip" id="t-fakt" aria-pressed="true">Fakty</button>
      <span class="sep" aria-hidden="true"></span>
      <button class="chip s-nowy" id="s-nowy" aria-pressed="true">Nie widziałem</button>
      <button class="chip s-nieumiem" id="s-nieumiem" aria-pressed="true">Nie umiem</button>
      <button class="chip s-umiem" id="s-umiem" aria-pressed="true">Umiem</button>
    </div>
    <div class="filters">
      <select id="temat" aria-label="Temat"><option value="all">Wszystkie tematy</option></select>
      <select id="egzamin" aria-label="Egzamin"><option value="all">Wszystkie egzaminy</option></select>
      <button class="ghost" id="shuffle">Przetasuj</button>
      <span class="progress" id="progress"></span>
    </div>
    <div class="panel" id="panel" hidden>
      <div>Postęp zapisuje się w tej przeglądarce. Żeby przenieść go na inne urządzenie, skopiuj go tutaj i wklej tam.</div>
      <div class="panel-row">
        <button class="ghost" id="p-copy">Kopiuj postęp</button>
        <button class="ghost" id="p-load">Wczytaj z pola poniżej</button>
        <button class="ghost" id="p-reset">Wyczyść wszystko</button>
        <span class="panel-msg" id="p-msg"></span>
      </div>
      <textarea id="p-box" placeholder="Wklej tu skopiowany postęp i kliknij „Wczytaj”." spellcheck="false"></textarea>
    </div>
  </div>
</header>

<main id="feed">
  <div class="empty"><h2>Wczytuję kafelki…</h2><p>Chwila — baza zadań waży około dwóch megabajtów.</p></div>
</main>
<div id="sentinel"></div>
<div class="loading" id="loading" hidden>losuję kolejne…</div>

<script src="katex/katex.min.js"></script>
<script src="marked.min.js"></script>
<script>
(function(){
  "use strict";
  var DATA = [];
  var LS = {
    get:function(k,d){ try{ var v=localStorage.getItem('feedakt.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
    set:function(k,v){ try{ localStorage.setItem('feedakt.'+k,JSON.stringify(v)); }catch(e){} }
  };

  /* ---- stan wiedzy: id kafelka -> 'umiem' | 'nieumiem' (brak wpisu = 'nowy') ---- */
  var MARK = LS.get('mark',{});
  function st(id){ return MARK[id] || 'nowy'; }
  function setSt(id,v){
    if(v==='nowy') delete MARK[id]; else MARK[id]=v;
    LS.set('mark',MARK); updateProgress();
  }

  var state = {
    modul:   LS.get('modul','ryzyko'),
    typy:    LS.get('typy',['zadanie','wzor','fakt']),
    status:  LS.get('status',['nowy','nieumiem','umiem']),
    temat:   LS.get('temat','all'),
    egzamin: LS.get('egzamin','all')
  };

  /* ---- markdown + LaTeX ---- */
  function md(src){
    if(!src) return '';
    var math=[];
    var s=String(src)
      .replace(/\$\$([\s\S]+?)\$\$/g,function(m,tex){math.push([tex,true]);return '@@M'+(math.length-1)+'@@';})
      .replace(/\$([^$\n]+?)\$/g,function(m,tex){math.push([tex,false]);return '@@M'+(math.length-1)+'@@';});
    var html;
    try{ html=marked.parse(s,{gfm:true,breaks:false,mangle:false,headerIds:false}); }
    catch(e){ html='<p>'+s+'</p>'; }
    html=html.replace(/@@M(\d+)@@/g,function(m,i){
      var e=math[+i];
      try{ return katex.renderToString(e[0],{displayMode:e[1],throwOnError:false,strict:false}); }
      catch(err){ return '<code>'+e[0].replace(/</g,'&lt;')+'</code>'; }
    });
    return html.replace(/<table>/g,'<div class="scroll-x"><table>').replace(/<\/table>/g,'</table></div>');
  }
  function mdInline(src){ return md(src).replace(/^<p>/,'').replace(/<\/p>\s*$/,''); }

  /* ---- budowa kafelka ---- */
  var KIND={zadanie:'Zadanie',wzor:'Wzór',fakt:'Fakt'};
  var STLBL={nowy:'Nie widziałem',nieumiem:'Nie umiem',umiem:'Umiem'};
  var MODULES={ryzyko:'Ryzyko',majatek:'Majątek',zycie:'Życie'};
  function build(c){
    var el=document.createElement('article');
    el.className='card';
    el.setAttribute('data-st',st(c.id));
    var src = c.typ==='zadanie' ? (c.egzamin+'/'+c.zadanie) : (c.zrodlo||('egz. '+c.egzamin));
    var pts = c.typ==='zadanie' && c.punkty ? ' · '+c.punkty+'p' : '';

    var head=document.createElement('div');
    head.className='card-head';
    head.innerHTML='<span class="kind k-'+c.typ+'">'+KIND[c.typ]+'</span>'+
                   '<span class="src">'+src+pts+'</span>'+
                   '<span class="topic">'+(c.temat||'')+'</span>';
    el.appendChild(head);

    var body=document.createElement('div');
    body.className='card-body';
    body.innerHTML=(c.tytul?'<h2 class="card-title">'+mdInline(c.tytul)+'</h2>':'')+md(c.tresc);
    el.appendChild(body);

    if(c.typ==='zadanie' && c.rozwiazanie){
      var btn=document.createElement('button');
      btn.className='reveal';
      btn.setAttribute('aria-expanded','false');
      btn.innerHTML='<span class="arrow">▸</span><span class="lbl">Pokaż rozwiązanie</span>';
      var sol=document.createElement('div');
      sol.className='sol'; sol.hidden=true;
      var built=false;
      btn.addEventListener('click',function(){
        var open=el.classList.toggle('open');
        if(open && !built){
          sol.innerHTML=(c.odpowiedz?'<p><strong>Klucz KNF: ('+c.odpowiedz+')</strong></p>':'')+
            md(c.rozwiazanie)+
            (c.uwagi_klucz?'<div class="note"><b>Uwaga do klucza KNF</b>'+md(c.uwagi_klucz)+'</div>':'');
          built=true;
        }
        sol.hidden=!open;
        btn.setAttribute('aria-expanded',String(open));
        btn.querySelector('.lbl').textContent=open?'Ukryj rozwiązanie':'Pokaż rozwiązanie';
      });
      el.appendChild(btn); el.appendChild(sol);
    }

    /* znacznik wiedzy */
    var mark=document.createElement('div');
    mark.className='mark';
    mark.innerHTML='<span class="mark-lbl">'+STLBL[st(c.id)]+'</span>'+
      '<button class="mk mk-no" type="button">Nie umiem</button>'+
      '<button class="mk mk-yes" type="button">Umiem</button>';
    function apply(v){
      setSt(c.id,v);
      el.setAttribute('data-st',v);
      mark.querySelector('.mark-lbl').textContent=STLBL[v];
    }
    mark.querySelector('.mk-no').addEventListener('click',function(){
      apply(st(c.id)==='nieumiem' ? 'nowy' : 'nieumiem');
    });
    mark.querySelector('.mk-yes').addEventListener('click',function(){
      apply(st(c.id)==='umiem' ? 'nowy' : 'umiem');
    });
    el.appendChild(mark);
    return el;
  }

  /* ---- pula i losowanie ---- */
  var pool=[], cursor=0, shown=0;
  var feed=document.getElementById('feed'), count=document.getElementById('count'),
      loading=document.getElementById('loading'), temat=document.getElementById('temat'),
      egzamin=document.getElementById('egzamin'), progress=document.getElementById('progress');

  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } }
  function emptyState(msg,sub){
    var d=document.createElement('div'); d.className='empty';
    d.innerHTML='<h2>'+msg+'</h2><p>'+sub+'</p>';
    return d;
  }
  function matches(c){
    return c.modul===state.modul &&
           state.typy.indexOf(c.typ)>-1 &&
           state.status.indexOf(st(c.id))>-1 &&
           (state.temat==='all'||c.temat===state.temat) &&
           (state.egzamin==='all'||String(c.egzamin)===state.egzamin);
  }
  function rebuild(){
    pool=DATA.filter(matches);
    shuffle(pool); cursor=0; shown=0; koniec=false;
    feed.innerHTML='';
    if(!pool.length){
      var pustyModul=!DATA.some(function(c){ return c.modul===state.modul; });
      feed.appendChild(pustyModul
        ? emptyState(MODULES[state.modul]+' w przygotowaniu',
            'Ten moduł jeszcze nie ma kafelków — dosypujemy go partiami. Przełącz na inny moduł.')
        : emptyState('Nic nie pasuje',
            'Żaden kafelek nie pasuje do wybranych filtrów. Poluzuj temat, egzamin albo włącz więcej stanów wiedzy.'));
      loading.hidden=true; updateCount(); return;
    }
    loading.hidden=false;
    append(5);
  }
  /* Mała pula (np. sam filtr „umiem") kończy się zamiast powtarzać w kółko
     te same kilka kafelków — przy większej puli scroll jest nieskończony. */
  var MIN_CYKL=8, koniec=false;
  function append(n){
    if(koniec) return;
    var frag=document.createDocumentFragment();
    n=Math.min(n,pool.length);
    for(var i=0;i<n;i++){
      if(cursor>=pool.length){
        if(pool.length<MIN_CYKL){
          koniec=true;
          var d=document.createElement('div'); d.className='empty';
          d.innerHTML='<h2>To wszystko</h2><p>Przy tych filtrach zostało '+pool.length+
            (pool.length===1?' kafelek':(pool.length<5?' kafelki':' kafelków'))+
            '. Poluzuj filtry albo przetasuj, żeby lecieć dalej.</p>';
          frag.appendChild(d); break;
        }
        shuffle(pool); cursor=0;
      }
      frag.appendChild(build(pool[cursor++])); shown++;
    }
    feed.appendChild(frag); updateCount();
    if(koniec) loading.hidden=true;
  }
  function updateCount(){ count.textContent = pool.length ? (shown+' / '+pool.length+' w puli') : '0 kafelków'; }
  function updateProgress(){
    var u=0,n=0,o=0;
    for(var i=0;i<DATA.length;i++){
      if(DATA[i].modul!==state.modul) continue;
      var s=st(DATA[i].id);
      if(s==='umiem') u++; else if(s==='nieumiem') n++; else o++;
    }
    progress.innerHTML='<span class="p-u">umiem <b>'+u+'</b></span>'+
                       '<span class="p-n">nie umiem <b>'+n+'</b></span>'+
                       '<span>nowe <b>'+o+'</b></span>';
  }

  /* ---- sterowanie ---- */
  function syncUI(){
    Object.keys(MODULES).forEach(function(m){
      document.getElementById('m-'+m).setAttribute('aria-pressed',String(state.modul===m));
    });
    ['zadanie','wzor','fakt'].forEach(function(t){
      document.getElementById('t-'+t).setAttribute('aria-pressed',String(state.typy.indexOf(t)>-1));
    });
    ['nowy','nieumiem','umiem'].forEach(function(s){
      document.getElementById('s-'+s).setAttribute('aria-pressed',String(state.status.indexOf(s)>-1));
    });
  }
  function fillSelects(){
    var seenT={}, listT=[], seenE={}, listE=[];
    DATA.forEach(function(c){
      if(c.modul!==state.modul) return;
      if(!seenT[c.temat]){ seenT[c.temat]=1; listT.push(c.temat); }
      if(!seenE[c.egzamin]){ seenE[c.egzamin]=1; listE.push(c.egzamin); }
    });
    listT.sort(function(a,b){ return a.localeCompare(b,'pl'); });
    listE.sort(function(a,b){ return b-a; });
    temat.innerHTML='<option value="all">Wszystkie tematy</option>';
    listT.forEach(function(t){ var o=document.createElement('option'); o.value=t; o.textContent=t; temat.appendChild(o); });
    if(listT.indexOf(state.temat)===-1) state.temat='all';
    temat.value=state.temat;
    egzamin.innerHTML='<option value="all">Wszystkie egzaminy</option>';
    listE.forEach(function(e){ var o=document.createElement('option'); o.value=String(e); o.textContent='Egzamin '+e; egzamin.appendChild(o); });
    if(listE.map(String).indexOf(state.egzamin)===-1) state.egzamin='all';
    egzamin.value=state.egzamin;
  }
  function setModul(m){ state.modul=m; LS.set('modul',m); syncUI(); fillSelects(); updateProgress(); rebuild(); window.scrollTo(0,0); }

  Object.keys(MODULES).forEach(function(m){
    document.getElementById('m-'+m).addEventListener('click',function(){ setModul(m); });
  });
  ['zadanie','wzor','fakt'].forEach(function(t){
    document.getElementById('t-'+t).addEventListener('click',function(){
      var i=state.typy.indexOf(t);
      if(i>-1){ if(state.typy.length===1) return; state.typy.splice(i,1); } else state.typy.push(t);
      LS.set('typy',state.typy); syncUI(); rebuild();
    });
  });
  ['nowy','nieumiem','umiem'].forEach(function(s){
    document.getElementById('s-'+s).addEventListener('click',function(){
      var i=state.status.indexOf(s);
      if(i>-1){ if(state.status.length===1) return; state.status.splice(i,1); } else state.status.push(s);
      LS.set('status',state.status); syncUI(); rebuild();
    });
  });
  temat.addEventListener('change',function(){ state.temat=temat.value; LS.set('temat',state.temat); rebuild(); });
  egzamin.addEventListener('change',function(){ state.egzamin=egzamin.value; LS.set('egzamin',state.egzamin); rebuild(); });
  document.getElementById('shuffle').addEventListener('click',function(){ rebuild(); window.scrollTo(0,0); });

  /* ---- panel postępu ---- */
  var panel=document.getElementById('panel'), pmsg=document.getElementById('p-msg'), pbox=document.getElementById('p-box');
  progress.addEventListener('click',function(){ panel.hidden=!panel.hidden; pmsg.textContent=''; });
  progress.style.cursor='pointer';
  progress.title='Kliknij, żeby przenieść postęp na inne urządzenie';
  function say(t){ pmsg.textContent=t; setTimeout(function(){ if(pmsg.textContent===t) pmsg.textContent=''; },4000); }
  document.getElementById('p-copy').addEventListener('click',function(){
    var txt=JSON.stringify(MARK);
    pbox.value=txt;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ say('Skopiowane do schowka.'); },
        function(){ pbox.select(); say('Zaznaczone — skopiuj ręcznie.'); });
    } else { pbox.select(); say('Zaznaczone — skopiuj ręcznie.'); }
  });
  document.getElementById('p-load').addEventListener('click',function(){
    try{
      var o=JSON.parse(pbox.value);
      if(!o || typeof o!=='object' || Array.isArray(o)) throw new Error('zły format');
      var n=0;
      for(var k in o){ if(o[k]==='umiem'||o[k]==='nieumiem'){ MARK[k]=o[k]; n++; } }
      LS.set('mark',MARK); updateProgress(); rebuild();
      say('Wczytano '+n+' oznaczeń.');
    }catch(e){ say('To nie wygląda na zapisany postęp.'); }
  });
  document.getElementById('p-reset').addEventListener('click',function(){
    MARK={}; LS.set('mark',MARK); updateProgress(); rebuild(); say('Wyczyszczone.');
  });

  /* ---- nieskończony scroll ---- */
  new IntersectionObserver(function(es){
    if(es[0].isIntersecting && pool.length) append(4);
  },{rootMargin:'900px'}).observe(document.getElementById('sentinel'));

  syncUI();
  fetch('cards.json',{cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ DATA=d; fillSelects(); updateProgress(); rebuild(); })
    .catch(function(e){
      feed.innerHTML='';
      feed.appendChild(emptyState('Nie udało się wczytać bazy zadań',
        'Plik cards.json nie odpowiedział ('+e.message+'). Odśwież stronę albo sprawdź, czy leży obok index.html.'));
      count.textContent='—';
    });
})();
</script>
</body>
</html>
